<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuevo Inicio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="main-container">
    <header class="header">
      <div class="left">
        <div class="profile-pic" aria-label="Foto de perfil"></div>
        <div class="user-data">
          <strong class="username">usuario_ejemplo</strong>
          <span class="location">Altadena, California</span>
        </div>
      </div>

      <button class="menu-btn" aria-label="Menu">&#8942;</button>
    </header>

    <section class="image-container" aria-label="Imagen de la publicacion">
      <img src="https://i.postimg.cc/rs62dsLr/image.png" alt="Imagen de la publicacion" />
    </section>

    <section class="post-actions" aria-label="Acciones de la publicacion">
      <div class="actions-left">
        <button class="icon-btn" id="like-button" aria-label="Me gusta">
          <i class="fa-regular fa-heart"></i>
        </button>
        <button class="icon-btn" id="comment-button" aria-label="Comentar">
          <i class="fa-regular fa-comment"></i>
        </button>
        <button class="icon-btn" aria-label="Compartir">
          <i class="fa-regular fa-paper-plane"></i>
        </button>
      </div>

      <button class="icon-btn" id="save-button" aria-label="Guardar" aria-pressed="false">
        <i class="fa-regular fa-bookmark"></i>
      </button>
    </section>

    <section class="likes-row" aria-label="Conteo de likes">
      <strong class="likes-heart">&#9829;</strong>
      <strong id="likes-count">0</strong>
      <span>Likes</span>
    </section>

    <section class="comments-section" aria-label="Sección de comentarios">
      <p id="default-comment">
        <a href="#" class="comment-user"><strong>usuario_ejemplo</strong></a>
        Lorem ipsum dolor sit amet, <a href="#">#augue</a> <a href="#">#adipiscing</a> <a href="#">#elit</a>, <a href="#">#do</a> <a href="#">#eiusmod</a> <a href="#">#tempor</a>.
      </p>

      <div id="comments-list" aria-live="polite"></div>

      <form id="comment-form" class="comment-form" aria-label="Agregar comentario">
        <input
          id="comment-input"
          type="text"
          placeholder="Escribe un comentario..."
          maxlength="180"
          aria-label="Nuevo comentario"
          required
        />
        <button type="submit" class="comment-submit">Publicar</button>
      </form>
    </section>
  </div>

  <script>
    const likeButton = document.getElementById("like-button");
    const commentButton = document.getElementById("comment-button");
    const saveButton = document.getElementById("save-button");
    const commentForm = document.getElementById("comment-form");
    const commentInput = document.getElementById("comment-input");
    const defaultComment = document.getElementById("default-comment");
    const commentsList = document.getElementById("comments-list");
    const likesCount = document.getElementById("likes-count");
    const saveIcon = saveButton.querySelector("i");
    let totalLikes = 0;

    commentsList.hidden = true;

    likeButton.addEventListener("click", () => {
      totalLikes += 1;
      likesCount.textContent = totalLikes;
    });

    saveButton.addEventListener("click", () => {
      const isSaved = saveIcon.classList.toggle("fa-solid");
      saveIcon.classList.toggle("fa-regular", !isSaved);
      saveButton.setAttribute("aria-pressed", String(isSaved));
    });

    commentButton.addEventListener("click", () => {
      const isOpen = commentForm.classList.toggle("is-open");
      commentsList.hidden = !isOpen;

      if (isOpen) {
        commentInput.focus();
      } else {
        commentInput.blur();
      }
    });

    commentForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const commentText = commentInput.value.trim();

      if (!commentText) {
        return;
      }

      const comment = document.createElement("p");
      comment.innerHTML = '<a href="#" class="comment-user"><strong>usuario_ejemplo</strong></a> ';
      comment.append(document.createTextNode(commentText));
      commentsList.appendChild(comment);

      commentForm.reset();
      commentInput.focus();
    });
  </script>
</body>
</html>
